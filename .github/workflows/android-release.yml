name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only version: MAJOR.MINOR.PATCH (does not publish)'
        required: true
        default: '0.7.1'
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Serialize both same-tag reruns and different-tag publication/latest updates.
# queue:max is supported by GitHub.com: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: q-screenshot-apk-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    env:
      EXPECTED_DEBUG_CERT_SHA256: 693ccbb031d4296c9edcf08c1f916e201ad1fd7757b8dc62a87b0d1ca92d3ea3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate deterministic version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          python3 -m unittest discover -s tools -p test_ci_version.py
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 tools/ci_version.py version --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          else
            python3 tools/ci_version.py version --version "$MANUAL_VERSION" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Prepare Android SDK 37.0
        run: |
          # Ubuntu24.04 includes these packages and accepted SDK licenses. Never auto-accept new terms.
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0' </dev/null
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Restore the existing test signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.QSCREENSHOT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::Missing repository secret QSCREENSHOT_DEBUG_KEYSTORE_BASE64; refusing a random debug signing key.'
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          actual=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)
          if [[ "$actual" != "$EXPECTED_DEBUG_CERT_SHA256" ]]; then
            echo '::error::The signing certificate does not match the previously published test APK.'
            exit 1
          fi
      - name: Build and verify APK
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version_name }}
          BUILD_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon --no-watch-fs -PciVersionName="$BUILD_VERSION" -PciVersionCode="$BUILD_CODE" test :app:lintDebug :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Q-screenshot.apk
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Q-screenshot.apk | awk -F': ' '/^Signer #1 certificate SHA-256 digest: / {print $2}')
          test "$actual" = "$EXPECTED_DEBUG_CERT_SHA256"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/Q-screenshot.apk)
          grep -F "versionCode='$BUILD_CODE'" <<< "$badging"
          grep -F "versionName='$BUILD_VERSION'" <<< "$badging"
          (cd dist && sha256sum Q-screenshot.apk > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Q-screenshot-${{ github.run_id }}
          path: |
            dist/Q-screenshot.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Q-screenshot-${{ github.run_id }}
          path: dist
      - name: Publish stable assets without moving latest backwards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.build.outputs.version_name }}
          BUILD_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          checksum=$(cut -d ' ' -f1 dist/SHA256SUMS.txt)
          printf 'Q-screenshot %s\n\nDebug 签名测试版；沿用既有证书，可覆盖升级。\n适用 Android 10+，arm64-v8a / x86_64。\nversionCode: %s\n\nAPK SHA256: `%s`\n' "$BUILD_VERSION" "$BUILD_CODE" "$checksum" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease > "$RUNNER_TEMP/existing-release.json"; then
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit("Existing release is a draft/prerelease; owner must resolve it first" if r["isDraft"] or r["isPrerelease"] else 0)' "$RUNNER_TEMP/existing-release.json"
            gh release edit "$GITHUB_REF_NAME" --title "Q-screenshot $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "Q-screenshot $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Q-screenshot.apk dist/SHA256SUMS.txt --clobber
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          promote=$(python3 tools/ci_version.py latest --tag "$GITHUB_REF_NAME" --releases "$RUNNER_TEMP/releases.json")
          if [[ "$promote" == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --latest
          fi
